<!-- /*==========================
    NEW OPERATOR LOGIN PAGE
===========================*/ -->

  <div class="auth-wrapper">

  <div class="auth-content">

    <!-- Logo -->
    <div class="text-center mb-4">
      <img src="assets/images/white_logo.png" class="login-logo" alt="ODBUS">
    </div>

    <!-- Card -->
    <div class="login-card">

      <form [formGroup]="form" novalidate>
        <h3 class="login-title">
          Operator Dashboard
        </h3>

        <p class="login-subtitle">
          Sign in to manage your buses.
        </p>

        <!-- Email -->

        <div class="form-group mb-4">

          <label class="login-label">
            Email Address
          </label>

          <div class="input-box">

            <i class="fa fa-envelope input-icon"></i>

            <input type="email" class="form-control login-input" formControlName="email" placeholder="Enter your email">

          </div>

          <small class="text-danger"
            *ngIf="form.controls['email'].touched && form.controls['email'].hasError('required')">

            Email is required.

          </small>

        </div>

        <!-- Password -->

        <div class="form-group mb-2">

          <label class="login-label">
            Password
          </label>

          <div class="input-box">

            <i class="fa fa-lock input-icon"></i>

            <input [type]="showPassword ? 'text' : 'password'" class="form-control login-input password-input"
              formControlName="password" placeholder="Enter your password">

            <button type="button" class="password-toggle" (click)="togglePassword()">

              <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'">
              </i>

            </button>

          </div>

          <small class="text-danger"
            *ngIf="form.controls['password'].touched && form.controls['password'].hasError('required')">

            Password is required.

          </small>

        </div>

        <!-- Forgot Password -->

        <div class="d-flex justify-content-end mb-4">

          <a routerLink="/forget-password" class="forgot-link">

            Forgot Password?

          </a>

        </div>

        <!-- Login Button -->

        <button type="button" class="btn login-btn w-100" [disabled]="!form.valid" (click)="check_credentials()">

          <i class="fa fa-sign-in-alt me-2"></i>

          Login

        </button>

      </form>

    </div>

    <!-- Footer -->

    <div class="text-center mt-4">

      <small class="copyright">

        © {{currentYear || 2026}} ODBUS • Operator Panel

      </small>

    </div>

  </div>

</div>
